name: Plug-in report
description: Tell us whether a legacy plug-in works (or doesn't) with the shim
labels: ["plug-in report"]
body:
  - type: input
    id: plugin
    attributes:
      label: Plug-in and version
      placeholder: "FXpansion Geist2 2.1.2.13"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works (loads, sounds right, project restores, editor opens)
        - Partly works (describe below)
        - Doesn't work
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host / DAW and version
      placeholder: "Ableton Live 12.4.6"
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 27.0 (26A428), M1 Max"
  - type: textarea
    id: config
    attributes:
      label: Generated config
      description: Paste configs/<Name>.plist (from tools/make_config.py)
      render: xml
  - type: textarea
    id: auval
    attributes:
      label: auval output
      description: "Output of `arch -x86_64 auval -v <type> <subtype> <manu>` (the last ~30 lines are enough)"
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Notes
